name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository
        run: python scripts/check_repo.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build release archive
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python scripts/package_plugin.py
